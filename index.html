<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>💰 Family Expense Tracker</h1>
                    <p>Keep track of your family's spending in one place.</p>
                </div>
        
                <button id="darkModeButton" class="dark-button">
                    🌙 Dark Mode
                </button>
            </div>
        </header>

        <div class="card">

            <h2>📊 Family Summary</h2>
        
            <div class="summary">
        
                <div class="summary-box">
                    <h3>Total Spent</h3>
                    <p>₹0</p>
                </div>
        
                <div class="summary-box">
                    <h3>This Month</h3>
                    <p>₹0</p>
                </div>
        
            </div>
        
        </div>
        
        <div class="card">
        
            <h2>👨‍👩‍👧‍👦 Spending by Family Member</h2>
        
            <div id="memberSummary" class="member-summary"></div>
        
        </div>
                    <div class="form-group">
                        <label for="category">Category</label>

                        <select id="category">
                            <option>Food</option>
                            <option>Transport</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Education</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="paidBy">Paid By</label>

                        <select id="paidBy">
                            <option>Dad</option>
                            <option>Mom</option>
                            <option>Me</option>
                            <option>Other</option>
                        </select>
                    </div>

                </div>

                <button type="button">
                    Add Expense
                </button>

            </form>

        </div>

        <div class="card">

            <h2>📊 Family Summary</h2>

            <div class="summary">

                <div class="summary-box">
                    <h3>Total Spent</h3>
                    <p>₹0</p>
                </div>

                <div class="summary-box">
                    <h3>This Month</h3>
                    <p>₹0</p>
                </div>

            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
